[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/.dotfiles"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/.z/projects"
desc = "Go to projects"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Downloads"
desc = "Go to Downloads"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd ~/.config"
desc = "Go to config"

[[mgr.prepend_keymap]]
on = ["g", "w"]
run = "cd ~/.z/projects/capybara/www/"
desc = "Go to capybara www"

[[mgr.prepend_keymap]]
on = ["."]
run = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on = ["<C-t>"]
run = '''shell 'tmux split-window -h -c "$PWD"' --confirm'''
desc = "Open tmux split here"

[[mgr.prepend_keymap]]
on = ["<C-o>"]
run = '''shell 'open "$PWD"' --confirm'''
desc = "Open current folder in Finder"

[[mgr.prepend_keymap]]
on = ["e"]
run = "open"
desc = "Open (nvim for text/code, macOS open for the rest)"
