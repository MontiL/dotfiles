[mgr]
show_hidden = true
sort_dir_first = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
linemode = "size"

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
  { run = 'open "$@"', for = "macos" },
  { run = 'xdg-open "$@"', for = "linux" },
]
reveal = [
  { run = 'open -R "$@"', for = "macos" },
]

[open]
prepend_rules = [
  # Folders -> macOS open (Finder); on Linux falls back to xdg-open
  { mime = "inode/directory", use = "open" },

  # Plain text / code files -> nvim
  { mime = "text/*", use = "edit" },

  # Code & config files that often report as application/* or octet-stream
  { url = "*.{json,toml,yaml,yml,xml,md,lock,env,gitignore,gitattributes,dockerfile,conf,ini}", use = "edit" },
  { url = "*.{js,jsx,ts,tsx,mjs,cjs,html,htm,css,scss,sass,less,vue,svelte,astro}", use = "edit" },
  { url = "*.{py,rb,rs,go,c,cc,cpp,h,hh,hpp,java,kt,swift,sh,fish,zsh,bash,lua,vim}", use = "edit" },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
