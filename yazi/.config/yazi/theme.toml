# Nord theme for Yazi
[manager]
cwd = { fg = "#81A1C1" }

hovered = { reversed = true }
preview_hovered = { underline = true }

find_keyword = { fg = "#EBCB8B", bold = true, italic = true, underline = true }
find_position = { fg = "#A3BE8C", bg = "reset", italic = true }

marker_selected = { fg = "#A3BE8C", bg = "#A3BE8C" }
marker_copied = { fg = "#EBCB8B", bg = "#EBCB8B" }
marker_cut = { fg = "#BF616A", bg = "#BF616A" }

tab_active = { fg = "#2E3440", bg = "#88C0D0" }
tab_inactive = { fg = "#D8DEE9", bg = "#3B4252" }
tab_width = 1

border = { fg = "#4C566A" }

count_copied = { fg = "#2E3440", bg = "#EBCB8B" }
count_cut = { fg = "#2E3440", bg = "#BF616A" }
count_selected = { fg = "#2E3440", bg = "#A3BE8C" }

[mode]
normal_main = { fg = "#2E3440", bg = "#81A1C1", bold = true }
normal_alt = { fg = "#81A1C1", bg = "#3B4252" }
select_main = { fg = "#2E3440", bg = "#A3BE8C", bold = true }
select_alt = { fg = "#A3BE8C", bg = "#3B4252" }
unset_main = { fg = "#2E3440", bg = "#B48EAD", bold = true }
unset_alt = { fg = "#B48EAD", bg = "#3B4252" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#3B4252", bg = "#3B4252" }

mode_normal = { fg = "#2E3440", bg = "#81A1C1", bold = true }
mode_select = { fg = "#2E3440", bg = "#A3BE8C", bold = true }
mode_unset = { fg = "#2E3440", bg = "#B48EAD", bold = true }

progress_label = { fg = "#D8DEE9", bold = true }
progress_normal = { fg = "#88C0D0", bg = "#3B4252" }
progress_error = { fg = "#BF616A", bg = "#3B4252" }

permissions_t = { fg = "#81A1C1" }
permissions_r = { fg = "#EBCB8B" }
permissions_w = { fg = "#BF616A" }
permissions_x = { fg = "#A3BE8C" }
permissions_s = { fg = "#4C566A" }

[filetype]
rules = [
  { name = "*/", fg = "#81A1C1", bold = true },

  { name = "*.rs", fg = "#D08770" },
  { name = "*.lua", fg = "#81A1C1" },
  { name = "*.sh", fg = "#A3BE8C" },
  { name = "*.fish", fg = "#A3BE8C" },
  { name = "*.toml", fg = "#D8DEE9" },
  { name = "*.json", fg = "#EBCB8B" },
  { name = "*.yaml", fg = "#EBCB8B" },
  { name = "*.yml", fg = "#EBCB8B" },
  { name = "*.md", fg = "#8FBCBB" },
  { name = "*.txt", fg = "#D8DEE9" },

  { name = "*.js", fg = "#EBCB8B" },
  { name = "*.jsx", fg = "#88C0D0" },
  { name = "*.ts", fg = "#81A1C1" },
  { name = "*.tsx", fg = "#88C0D0" },
  { name = "*.css", fg = "#B48EAD" },
  { name = "*.html", fg = "#D08770" },

  { name = "*.py", fg = "#81A1C1" },
  { name = "*.c", fg = "#81A1C1" },
  { name = "*.cpp", fg = "#81A1C1" },

  { name = "*.jpg", fg = "#B48EAD" },
  { name = "*.jpeg", fg = "#B48EAD" },
  { name = "*.png", fg = "#B48EAD" },
  { name = "*.gif", fg = "#B48EAD" },
  { name = "*.svg", fg = "#B48EAD" },
  { name = "*.webp", fg = "#B48EAD" },

  { name = "*.zip", fg = "#D08770" },
  { name = "*.tar", fg = "#D08770" },
  { name = "*.gz", fg = "#D08770" },
  { name = "*.7z", fg = "#D08770" },

  { name = ".git*", fg = "#D08770", italic = true },
  { name = ".env*", fg = "#BF616A", italic = true },
]
