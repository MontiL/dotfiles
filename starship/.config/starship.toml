format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$docker_context\
$package\
$cmd_duration\
${custom.at_jobs}\
${custom.cafe}\
$line_break\
$character"""

# Inserts a blank line between shell prompts
#add_newline = true

# Replace the "❯" symbol in the prompt with "➜"
#[character] # The name of the module we are configuring is "character"
#success_symbol = "[➜](bold green)" # The "success_symbol" segment is being set to "➜" with the color "bold green"

# Disable the package module, hiding it from the prompt completely
#[package]
#disabled = true
command_timeout = 1000

# [git_status]
# conflicted = "🏳"
# ahead = "🏎💨"
# behind = "😰"
# diverged = "😵"
# up_to_date = "✓"
# untracked = "🤷"
# stashed = "📦"
# modified = "📝"
# staged = '[++\($count\)](green)'
# renamed = "👅"
# deleted = "🗑"

[git_status]
ahead = "[⇡${count}](green)"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
conflicted = "=${count}"
untracked = "?${count}"
stashed = "📦${count}"
modified = "[!${count}](yellow)"
staged = '[\(+$count\)](green)'
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[V](bold green) "

[aws]
# disabled = true
# force_display = true
# format = 'on [$symbol($profile )(\($region\) )]($style)'
# style = 'yellow'
# symbol = '🅰 '
[aws.region_aliases]
ap-northeast-1 = "Japan"
# [aws.profile_aliases]
# CompanyGroupFrobozzOnCallAccess = 'Frobozz'

[battery]
disabled = true

[custom.at_jobs]
command = "atq | command wc -l | tr -d ' '"
when = "atq | grep -q '.'"
format = "[⏳ $output]($style) "
style = "bold blue"

# 自定義咖啡模組
[custom.cafe]
description = "顯示咖啡狀態"
# starship 預設用 $SHELL (fish) 跑 command/when，這裡用 POSIX 語法所以指定 sh
# （不要自己加 -c，starship 是把指令從 stdin 餵給 shell）
shell = ["/bin/sh"]
# 只認 cafe 開的那隻 caffeinate（見 fish/functions/cafe.fish）。
# 不能用 pgrep -x caffeinate：Claude Code 等工具也會開 caffeinate，圖示會誤亮。
when = 'pid=$(cat "$HOME/.cache/cafe.pid" 2>/dev/null); [ -n "$pid" ] && ps -o comm= -p "$pid" 2>/dev/null | grep -q caffeinate'
# custom 模組在 output 為空時整個不顯示，所以圖示要由 command 印出來
command = "printf '☕'"
format = "[$output]($style) "
style = "bold yellow"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = " "

[python]
format = "[${symbol}(${version})]($style) "
symbol = " "

[rust]
format = "[$symbol($version)]($style) "
symbol = " "

[docker_context]
only_with_files = true

[package]
display_private = true

[cmd_duration]
min_time = 2000

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
