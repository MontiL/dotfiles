# $TERM should be "screen-256color" or "tmux-256color" in tmux. Colors might look wrong.
# Set default-terminal in ~/.tmux.conf:
# set -ag terminal-overrides ",xterm-256color:RGB"
# #set-option -g default-terminal "screen-256color"
# set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-environment -g COLORTERM "truecolor"

set-option -g default-command /opt/homebrew/bin/fish
set-option -g default-shell /opt/homebrew/bin/fish

# `focus-events` is not enabled. 'autoread' may not work.
#  (tmux 1.9+ only) Set `focus-events` in ~/.tmux.conf:
# set-option -g focus-events on

# Key bindings (bind/unbind is alias of bind-key/unbind-key)
#-----------------------------------------------------------------------------
# Remap prefix key
unbind C-b
set -g prefix C-t
bind C-t last-window
# bind C-p previous-window
# bind C-n next-window
# Key bindings may be changed with the bind-key and unbind-key commands.
# bind C-t send-prefix
#bind t send-key C-t

# Remap the key of copy-mode
# Use vim keybindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection     # Begin selection in copy mode.
bind -T copy-mode-vi C-v send -X rectangle-toggle  # Begin selection in copy mode.
bind -T copy-mode-vi y send -X copy-selection      # Yank selection in copy mode. bind-key -t vi-copy Enter copy-pipe "pbcopy"
# unbind default rectangle-toggle binding:
# unbind-key -T vi-copy v  # Prior to version 2.4
# unbind-key -T copy-mode-vi v

# Reload settings
bind r source-file ~/.tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open #{pane_current_path}"
bind e kill-pane -a

# bind h run-shell "~/.dotfiles/tmux/toggle_status_time.sh"

# vim-like pane switching
bind -r h select-pane -L 
bind -r j select-pane -D 
bind -r k select-pane -U 
bind -r l select-pane -R 
# Resizing pane
bind -n C-Left resize-pane -L 5
bind -n C-Down resize-pane -D 5
bind -n C-Up resize-pane -U 5
bind -n C-Right resize-pane -R 5

# Restoring Clear Screen (C-l)
bind C-l send-keys 'C-l'
# Restoring SIGQUIT (C-\)
bind C-\\ send-keys 'C-\'

# Moving panel
# TODO

# Moving window sequence
bind -n C-S-Left swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# Remapping the split window
# Split panes with \ and -
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind -r - split-window -v -c "#{pane_current_path}"
bind -r \\ split-window -h -c "#{pane_current_path}"
# Join windows: <prefix> s, <prefix> j
bind J command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind S command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind M command-prompt -p "move pane to:"  "move-window -t '%%'"
bind B break-pane

# use current workspace for new window
bind c new-window -c "#{pane_current_path}"
bind '.' new-window -c ~/.dotfiles
bind N new-session -c "#{pane_current_path}"

bind w choose-tree -swZ
# bind s choose-session

# Don't use some default keymap
unbind '"'
unbind %
unbind Up
unbind Down
unbind Left
unbind Right
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

set -g repeat-time 200

# basic settings
#-----------------------------------------------------------------------------

# Status Bar
set -g status-justify "left"
# set -g status-left 'Session:#{session_name}'
set -g status-left-length 20
# set -g status-style 'bg=colour18 fg=colour137 dim'

# set -g status-right '#[fg=colour23,bg=colour19] %m/%d #[fg=colour233,bg=colour8] %H:%M '
# set -g status-right '#[default]#[fg=white] %Y %h %d (%A) %l:%M %p #[default]#[fg=black,bg=white] #(echo $USER) @ #H '
# if-shell "test $(hostname) = 'im24.local'" \
#   'set -g status-right "#[default]#[fg=white] %h %d (%a) %l:%M %p #[default]#[fg=black,bg=white] #(echo $USER) @ #H "'
# if-shell "test $(hostname) != 'im24.local'" \
#   'set -g status-right "#[default]#[fg=white] %l:%M %p #[default]#[fg=black,bg=white] #(echo $USER) @ #H "'
set -g status-right "#[default]#[fg=white] #[default]#[fg=black,bg=white] #(echo $USER)@#H "
# set -g status-right "#[default]#[fg=white] %h %d (%a) %l:%M %p #[default]#[fg=black,bg=white] #(echo $USER) @ #H "

# tmux_conf_theme_status_right=' #{prefix}#{mouse}#{pairing}#{synchronized}#{?battery_status,#{battery_status},}#{?battery_bar, #{battery_bar},}#{?battery_percentage, #{battery_percentage},} , %R , %d %b | #{username}#{root} | #{hostname} '
set -g status-right-length 70
# active window title colors
# set-window-option -g window-status-current-style fg=colour166,bg=default,bright
# set-option -g status-fg cyan
# set-option -g status-bg black

# default statusbar colors
set -g status-style bg=colour235,fg=colour136,default

# setw -g window-status-current-style 'fg=colour1 bg=colour19 bold'
# highlight the current window in the status bar (blue background)
#       #I - window index
#       #W - window title
#       #F - window flag
# setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '
# default window title colors
setw -g window-status-style fg=colour244,bg=colour234,dim
# setw -g window-status-current-format '#[bg=brightcyan,fg=black] #I#[bg=brightcyan]:#[fg=black]#W#[fg=dim]#F '
setw -g window-status-current-format '#[bg=white,fg=black] #I#[bg=white]:#[fg=black]#W#[fg=dim]#F '

#set-option utf8-default on

set -g mouse on

# resize windows on larger screens - if off the size is capped to the smallest
# screen size that has ever looked at it
# setw -g aggressive-resize on

set-window-option -g mode-keys vi
#set-window-option -g utf8 on

# set -g history-limit 64096
# set -sg escape-time 10

# windows start at 1 instead of 0
set -g base-index 1

# COLOUR
#---------------------------------------------------------

# look'n feel
# set inactive/active window styles
# set -g window-style fg=colour247,bg=colour236
# set -g window-active-style fg=colour250,bg=black
# set -g window-style fg=black,bg=colour253
# set -g window-active-style fg=colour234,bg=colour231
set -g window-style fg=colour247,bg=default
set -g window-active-style fg=colour250,bg=default

# pane border
set -g pane-border-style fg=colour238,bg=colour236
set -g pane-active-border-style fg=colour51,bg=colour236

# pane border
# set-option -g pane-border-style fg=colour235 #base02
# set-option -g pane-active-border-style fg=colour136,bg=colour235

# message text
set -g message-style bg=colour235,fg=colour166

# pane number display
set -g display-panes-active-colour colour33 #blue
set -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# renumber-windows [on | off]
#  If on, when a window is closed in a session, automatically renum-
#  ber the other windows in numerical order.  This respects the
#  base-index option if it has been set.  If off, do not renumber
#  the windows.
set -g renumber-windows on

# clear window
# bind -n C-k clear-history

# import
if-shell "uname -s | grep -q Darwin" "source ~/.tmux.conf.osx"

# TPM
#---------------------------------------------------------
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
